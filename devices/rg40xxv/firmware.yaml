# Firmware catalogue — Anbernic RG40XX V (Allwinner H700)
#
# One entry per known image, stock or alternative.
#
#   sha256      null until the file has been hashed locally at least once.
#               The vendor publishes no checksums, so for stock images this is a
#               pin recorded on acquisition, NOT a verification against Anbernic.
#   flashable   direct  — dd and Balena Etcher consume it as-is, no scratch space
#               extract — must be expanded to a full-size .img first
#   retrieved   date the file was fetched and hashed, or null if not held locally
#
# Files themselves live in the store outside this repository ($META_RETRO_STORE),
# addressed by `filename`. Never commit an image here.

